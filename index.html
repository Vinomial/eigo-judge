<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>英語ジャッジ</title>
<meta name="description" content="TOEIC 550点を目指す競プロ式の英語トレーニング">
<meta name="theme-color" content="#F3F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13171D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="英語ジャッジ">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20">

<body>
<!-- ページ全体はスクロールさせず,#scroller の中だけをスクロールする.
     iPhone の Safari では,ページ全体をスクロールすると下に固定したタブバーが画面の途中に取り残されることがあるため -->
<div class="app">
<div class="scroller" id="scroller">
<div class="wrap">
  <header>
    <h1>英語ジャッジ</h1>
    <span class="hdr-r"><button id="hdr-coin" class="coin" data-go="shop" aria-label="ショップ"></button><span id="hdr-rate"></span></span>
  </header>
  <main id="main"></main>
</div>
</div>
<nav id="nav" aria-label="メニュー">
  <button data-v="home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg>ホーム</button>
  <button data-v="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h4v4H4zM10 6h10M4 11h4v4H4zM10 12h10M4 17h4v4H4zM10 18h10"/></svg>問題</button>
  <button data-v="contest"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="13" r="7"/><path d="M12 13V9M10 3h4"/></svg>本番</button>
  <button data-v="record"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h16M5 16l4-5 4 3 6-8"/></svg>記録</button>
  <button data-v="defs"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h10a4 4 0 014 4v12H9a4 4 0 01-4-4zM9 8h6M9 12h6"/></svg>定義集</button>
</nav>
</div>
<div id="toasts" aria-live="polite"></div>
<script src="data/words.js?v=20"></script>
<script src="data/vocab.js?v=20"></script>

<script src="js/list.js?v=20"></script>
<script src="js/solve.js?v=20"></script>
<script src="js/drill.js?v=20"></script>

<script src="js/shop.js?v=20"></script>
<script src="js/main.js?v=20"></script>
</body>
</html>
